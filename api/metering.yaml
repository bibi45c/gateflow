components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      description: |
        `METERING_INTERNAL_TOKEN`, sent by the gateway. Metering refuses to start
        when it is empty; a missing, empty or wrong token gets 401 `unauthorized`.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        The gateway request id, `req_<uuid>`. Metering sends the same value when it
        calls access; errors return it as `error.request_id`. The header is optional
        for metering: when it is missing, metering generates its own id and uses it
        in the error body and logs.
      schema:
        type: string
      example: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
  schemas:
    ReserveRequest:
      type: object
      additionalProperties: false
      required: [call_id, attempt_id, tenant_id, price_version_id, max_input_tokens, max_output_tokens]
      properties:
        call_id:
          type: string
          minLength: 1
          description: The gateway request id, `req_<uuid>`. With `attempt_id`, the idempotency key.
        attempt_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: The attempt of this call; the gateway sends 1.
        tenant_id:
          type: string
          minLength: 1
          description: The tenant whose wallet is held, as returned by access verify.
        price_version_id:
          type: string
          minLength: 1
          description: The price version to charge at, as returned by access verify.
        max_input_tokens:
          type: integer
          format: int64
          minimum: 0
          description: The most input tokens the call can use; the gateway sends the request body size in bytes.
        max_output_tokens:
          type: integer
          format: int64
          minimum: 0
          description: The most output tokens the call can use; the gateway sends the output bound of the request (see the bounds of reserve).
    ReserveResponse:
      type: object
      required: [reservation_id, max_cost, status]
      properties:
        reservation_id:
          type: string
        max_cost:
          type: integer
          format: int64
          minimum: 0
          description: The amount held, in micro-units.
        status:
          type: string
          const: reserved
          description: Always `reserved`, also in a replay after the reservation was settled.
    SettleRequest:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, outcome]
      properties:
        input_tokens:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            The input total by the usage source of settle, or null when it was 0 or
            never seen.
        output_tokens:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: The output tokens, or null when never seen. A reported 0 is sent as 0.
        outcome:
          $ref: '#/components/schemas/Outcome'
    Outcome:
      type: string
      description: |
        How the call ended, by the outcome rule of the settle operation:
        `not_dispatched`, `completed`, `client_cancelled`, `upstream_error` or
        `interrupted`, the first that matches. `upstream_error` and `not_dispatched`
        charge 0.
      enum:
        - completed
        - upstream_error
        - client_cancelled
        - interrupted
        - not_dispatched
    SettleResponse:
      type: object
      required: [charged, ledger_entry_id, status]
      properties:
        charged:
          type: integer
          format: int64
          minimum: 0
          description: The amount charged, in micro-units; at most the reservation's `max_cost`.
        ledger_entry_id:
          type: string
          description: The reservation's one ledger entry.
        status:
          type: string
          const: settled
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: A fixed string per code that never echoes request input.
            request_id:
              type: string
              description: The `X-Request-Id` of the request.
    ErrorCode:
      type: string
      description: The error codes metering returns; must match api/errors.md.
      enum:
        - invalid_request
        - unauthorized
        - wallet_not_found
        - reservation_not_found
        - insufficient_balance
        - idempotency_conflict
        - internal_error
        - dependency_unavailable
  examples:
    InvalidRequest:
      value:
        error:
          code: invalid_request
          message: The request body is invalid.
          request_id: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
    Unauthorized:
      value:
        error:
          code: unauthorized
          message: The internal token is missing or wrong.
          request_id: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
    WalletNotFound:
      value:
        error:
          code: wallet_not_found
          message: The tenant has no wallet.
          request_id: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
    InsufficientBalance:
      value:
        error:
          code: insufficient_balance
          message: The available balance is below the reservation amount.
          request_id: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
    ReservationNotFound:
      value:
        error:
          code: reservation_not_found
          message: The reservation does not exist.
          request_id: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
    IdempotencyConflict:
      value:
        error:
          code: idempotency_conflict
          message: The request differs from an earlier request with the same key.
          request_id: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
    InternalError:
      value:
        error:
          code: internal_error
          message: Internal error.
          request_id: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
    DependencyUnavailable:
      value:
        error:
          code: dependency_unavailable
          message: A dependency is unavailable.
          request_id: req_6b1e0c4d-2f3a-4c5b-8d6e-7f8091a2b3c4
  responses:
    Unauthorized:
      description: '`unauthorized`: the internal token is missing, empty or wrong.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              $ref: '#/components/examples/Unauthorized'
    IdempotencyConflict:
      description: |
        `idempotency_conflict`: an earlier reserve with the same (`call_id`,
        `attempt_id`), or an earlier settle of the same reservation, had different
        content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            idempotency_conflict:
              $ref: '#/components/examples/IdempotencyConflict'
