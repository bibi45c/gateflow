environment: aws
# URLs in gateflow-runtime must use sslmode=require.
# The chart refuses to render without ingress.inboundCidrs. No addresses are kept
# here: pass the operator's IP at deploy time with
#   --set-json 'ingress.inboundCidrs=["<your IP>/32"]'
# or a separate values file that is not committed (for example under .local/).
services:
  gateway:
    # One vCPU and 2 GiB per gateway Pod (proposal 5.6).
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 2Gi
# KEDA and Prometheus must be installed first; see README.md, Autoscaling.
autoscaling:
  enabled: true
  # Provisional until the 17 October single-Pod calibration (#73): T = 0.7 * C, with
  # C the per-Pod admission cap, and D the measured mean request duration in seconds.
  targetPerReplica: 70
  requestDurationSeconds: 20
