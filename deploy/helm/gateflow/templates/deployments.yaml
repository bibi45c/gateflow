{{- $s := .Values.shutdown -}}
{{- if lt (int $s.timeout) 60 -}}{{ fail "shutdown.timeout must be >=60 seconds" }}{{- end -}}
{{- if lt (int $s.grace) (int (add $s.preStop $s.drain $s.timeout $s.margin)) -}}{{ fail "shutdown.grace must cover preStop + drain + timeout + margin" }}{{- end -}}
{{- range $name, $service := .Values.services }}
{{- $labels := merge (dict "app.kubernetes.io/component" $name) (include "gf.labels" $ | fromJson) -}}
{{- $c := dict "name" $name "image" (include "gf.image" (dict "root" $ "service" $service)) "ports" (list (dict "name" "http" "containerPort" $service.port)) "env" (include "gf.env" (dict "root" $ "name" $name) | fromJsonArray) "resources" $service.resources -}}
{{- /* services.<name>.probes overrides the global probes field by field. */ -}}
{{- range $kind, $path := dict "readiness" "/readyz" "liveness" "/healthz" "startup" "/healthz" -}}
{{- $p := merge (dict) (get ($service.probes | default dict) $kind | default dict) (get $.Values.probes $kind) -}}
{{- $_ := set $c (printf "%sProbe" $kind) (dict "httpGet" (dict "path" $path "port" "http") "periodSeconds" (int $p.periodSeconds) "timeoutSeconds" (int $p.timeoutSeconds) "failureThreshold" (int $p.failureThreshold)) -}}
{{- end -}}
{{- $_ := set $c "lifecycle" (dict "preStop" (dict "sleep" (dict "seconds" $s.preStop))) -}}
{{- $_ := set $c "securityContext" (dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL"))) -}}
{{- $pod := dict "containers" (list $c) "automountServiceAccountToken" false "securityContext" (dict "runAsNonRoot" true "seccompProfile" (dict "type" "RuntimeDefault")) "terminationGracePeriodSeconds" $s.grace "nodeSelector" (dict "gateflow.io/workload" "services") -}}
{{- if and (eq $.Values.environment "aws") (or (eq $name "access") (eq $name "metering")) -}}
{{- $check := `set -eu
case "$DATABASE_URL" in
  *\?sslmode=require|*\?sslmode=require\&*|*\&sslmode=require|*\&sslmode=require\&*) ;;
  *) echo 'DATABASE_URL must use sslmode=require'; exit 1;;
esac
test "$(psql -X -tAc 'SELECT ssl FROM pg_stat_ssl WHERE pid=pg_backend_pid()' "$DATABASE_URL")" = t
` -}}
{{- $_ := set $pod "initContainers" (list (dict "name" "check-database-tls" "securityContext" (dict "runAsUser" 65532 "runAsGroup" 65532 "allowPrivilegeEscalation" false) "image" $.Values.postgresImage "env" (list (dict "name" "DATABASE_URL" "valueFrom" (dict "secretKeyRef" (dict "name" $.Values.secretName "key" (printf "%s_DATABASE_URL" (upper $name)))))) "command" (list "sh" "-c" $check))) -}}
{{- end -}}
{{- if eq $name "mock-upstream" -}}
{{- $_ := set $pod "nodeSelector" (dict "gateflow.io/workload" "load-generator") -}}
{{- $_ := set $pod "tolerations" (list (dict "key" "gateflow.io/workload" "operator" "Equal" "value" "load-generator" "effect" "NoSchedule")) -}}
{{- end -}}
{{- $spec := dict "selector" (dict "matchLabels" $labels) "template" (dict "metadata" (dict "labels" $labels) "spec" $pod) -}}
{{- /* With autoscaling, KEDA's HPA owns the gateway's replica count; a fixed value would fight it. */ -}}
{{- if not (and (eq $name "gateway") $.Values.autoscaling.enabled) -}}
{{- $_ := set $spec "replicas" $service.replicas -}}
{{- end }}
---
{{ dict "apiVersion" "apps/v1" "kind" "Deployment" "metadata" (dict "name" (printf "%s-%s" $.Release.Name $name) "labels" $labels) "spec" $spec | toJson }}
{{ end -}}
