{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "postgres-0",
    "labels": {
      "app": "gf-postgres"
    }
  },
  "spec": {
    "nodeSelector": {
      "gateflow.io/workload": "services"
    },
    "automountServiceAccountToken": false,
    "containers": [
      {
        "name": "postgres",
        "image": "postgres:17",
        "env": [
          {
            "name": "POSTGRES_USER",
            "value": "gateflow"
          },
          {
            "name": "POSTGRES_DB",
            "value": "gateflow"
          },
          {
            "name": "POSTGRES_PASSWORD",
            "valueFrom": {
              "secretKeyRef": {
                "name": "gateflow-bootstrap",
                "key": "PGPASSWORD"
              }
            }
          }
        ],
        "ports": [
          {
            "containerPort": 5432
          }
        ],
        "readinessProbe": {
          "exec": {
            "command": [
              "pg_isready",
              "-U",
              "gateflow",
              "-d",
              "gateflow"
            ]
          },
          "periodSeconds": 2
        },
        "resources": {
          "requests": {
            "cpu": "100m",
            "memory": "128Mi"
          },
          "limits": {
            "memory": "512Mi"
          }
        }
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "selector": {
      "app": "gf-postgres"
    },
    "ports": [
      {
        "port": 5432
      }
    ]
  }
}
