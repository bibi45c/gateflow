# Local development stack. Start it from the repository root, with a project name
# per worktree, and stop it with `down --volumes` when done:
#   docker compose -p <worktree-name> -f deploy/compose/compose.yaml up --build
# Ports bind to localhost only and can be changed through the *_PORT variables.
# Every password, token and secret here is a local-only default; never reuse one
# elsewhere. The variables are described in README.md next to this file.
name: gateflow

x-service-build: &service-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

# Longer than pkg/server.ShutdownTimeout (10 s), so a drain finishes before SIGKILL.
x-stop: &stop
  stop_grace_period: 15s

# The service binary checks its own /healthz; the images have no shell or curl.
x-healthcheck: &healthcheck
  test: ["CMD", "/app", "healthcheck"]
  interval: 2s
  start_period: 5s
  retries: 15

x-internal-urls: &internal-urls
  ACCESS_URL: http://access:8081
  METERING_URL: http://metering:8082

x-internal-tokens: &internal-tokens
  ACCESS_INTERNAL_TOKEN: &access-token ${ACCESS_INTERNAL_TOKEN:-access-token-local-only}
  METERING_INTERNAL_TOKEN: ${METERING_INTERNAL_TOKEN:-metering-token-local-only}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gateflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateflow-local-only}
      POSTGRES_DB: gateflow
    # Runs only when the volume is new; after changing it, recreate with `down --volumes`.
    volumes: ["./postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gateflow -d gateflow"]
      interval: 5s
      start_period: 10s
      retries: 10

  redis:
    image: redis:8
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  access:
    build:
      <<: *service-build
      args:
        TARGET: services/access
    <<: *stop
    environment: &access-environment
      DATABASE_URL: postgres://access:access-local-only@postgres:5432/gateflow?sslmode=disable
      ACCESS_INTERNAL_TOKEN: *access-token
      ACCESS_KEY_PEPPER: ${ACCESS_KEY_PEPPER:-key-pepper-local-only}
      ACCESS_SEED_SECRET: ${ACCESS_SEED_SECRET:-seed-secret-local-only}
      MOCK_UPSTREAM_BASE_URL: http://mock-upstream:8090
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      # Console users that seed-access creates; local-only passwords.
      CONSOLE_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD:-admin-local-only}
      CONSOLE_DEMO_PASSWORD: ${CONSOLE_DEMO_PASSWORD:-demo-local-only}
    ports: ["127.0.0.1:${ACCESS_PORT:-8081}:8081"]
    healthcheck: *healthcheck
    depends_on:
      postgres:
        condition: service_healthy

  metering:
    build:
      <<: *service-build
      args:
        TARGET: services/metering
    <<: *stop
    environment: &metering-environment
      <<: [*internal-urls, *internal-tokens]
      DATABASE_URL: postgres://metering:metering-local-only@postgres:5432/gateflow?sslmode=disable
    ports: ["127.0.0.1:${METERING_PORT:-8082}:8082"]
    healthcheck: *healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      access:
        condition: service_healthy

  # One-shot seeds of the test tenants, keys, channels and wallets that the gateway
  # needs. They run on every `up` and change nothing when the data is already there.
  # seed-access prints each tenant's key to its log; test/e2e/smoke.py derives them.
  seed-access:
    build:
      <<: *service-build
      args:
        TARGET: services/access
    command: ["seed", "--tenants", "10"]
    restart: "no"
    environment: *access-environment
    depends_on:
      access:
        condition: service_healthy

  seed-metering:
    build:
      <<: *service-build
      args:
        TARGET: services/metering
    # tenant-demo is the console demo user's tenant.
    command: ["seed", "--extra-tenants", "tenant-demo"]
    restart: "no"
    environment: *metering-environment
    depends_on:
      metering:
        condition: service_healthy
      seed-access:
        condition: service_completed_successfully

  mock-upstream:
    build:
      <<: *service-build
      args:
        TARGET: test/mock-upstream
    <<: *stop
    environment:
      MOCK_FIRST_EVENT_DELAY_MS: ${MOCK_FIRST_EVENT_DELAY_MS:-0}
      MOCK_EVENT_INTERVAL_MS: ${MOCK_EVENT_INTERVAL_MS:-0}
      MOCK_LOAD_EVENTS: ${MOCK_LOAD_EVENTS:-200}
      MOCK_LOAD_INTERVAL_MS: ${MOCK_LOAD_INTERVAL_MS:-100}
      MOCK_LOAD_EVENT_BYTES: ${MOCK_LOAD_EVENT_BYTES:-256}
    ports: ["127.0.0.1:${MOCK_UPSTREAM_PORT:-8090}:8090"]
    healthcheck: *healthcheck

  gateway:
    build:
      <<: *service-build
      args:
        TARGET: services/gateway
    <<: *stop
    environment:
      <<: [*internal-urls, *internal-tokens]
    # Lets the gateway reach an Ollama installed on the host, also on Linux.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    healthcheck: *healthcheck
    depends_on:
      redis:
        condition: service_healthy
      access:
        condition: service_healthy
      metering:
        condition: service_healthy
      mock-upstream:
        condition: service_healthy
      seed-metering:
        condition: service_completed_successfully

  # Optional: starts only with `--profile ollama`, for people who do not install
  # Ollama on the host. It runs on the CPU. See docs/clients/opencode.md.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.3
    environment:
      # A request, not a guarantee: Ollama caps it at the model's own maximum.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-64000}
    volumes: ["ollama-models:/root/.ollama"]
    ports: ["127.0.0.1:${OLLAMA_PORT:-11434}:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      start_period: 10s
      retries: 10

volumes:
  # Pulled models. `down --volumes` deletes them, and the next pull downloads again.
  ollama-models:
