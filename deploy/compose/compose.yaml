# Local development stack. Start it from the repository root, with a project name
# per worktree, and stop it with `down --volumes` when done:
#   docker compose -p <worktree-name> -f deploy/compose/compose.yaml up --build
# Ports bind to localhost only and can be changed through the *_PORT variables.
# The database password is a local-only default; never reuse it elsewhere.
name: gateflow

x-service-build: &service-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

# Longer than pkg/server.ShutdownTimeout (10 s), so a drain finishes before SIGKILL.
x-stop: &stop
  stop_grace_period: 15s

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gateflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateflow-local-only}
      POSTGRES_DB: gateflow
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gateflow -d gateflow"]
      interval: 5s
      start_period: 10s
      retries: 10

  redis:
    image: redis:8
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  access:
    build:
      <<: *service-build
      args:
        TARGET: services/access
    <<: *stop
    ports: ["127.0.0.1:${ACCESS_PORT:-8081}:8081"]
    depends_on:
      postgres:
        condition: service_healthy

  metering:
    build:
      <<: *service-build
      args:
        TARGET: services/metering
    <<: *stop
    ports: ["127.0.0.1:${METERING_PORT:-8082}:8082"]
    depends_on:
      postgres:
        condition: service_healthy

  mock-upstream:
    build:
      <<: *service-build
      args:
        TARGET: test/mock-upstream
    <<: *stop
    ports: ["127.0.0.1:${MOCK_UPSTREAM_PORT:-8090}:8090"]

  gateway:
    build:
      <<: *service-build
      args:
        TARGET: services/gateway
    <<: *stop
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      redis:
        condition: service_healthy
      access:
        condition: service_started
      metering:
        condition: service_started
      mock-upstream:
        condition: service_started
