name: Tests
on:
  push:
    branches: [main]
  # A retargeted stacked PR is rebased and pushed, which reruns this as synchronize.
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/repo/tests -v
      - run: python -m unittest discover -s loadtest -v
      - run: python -m unittest discover -s deploy/aws/tests -v

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  integration:
    name: Go integration (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway CI superuser; pkg/pgtest creates and drops one database per test.
      GATEFLOW_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # A throwaway Redis for the gateway's rate limit tests; each test uses its own tenant keys.
      GATEFLOW_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run every test against Postgres and Redis, failing if any of those tests skipped
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v -coverprofile="$RUNNER_TEMP/cover.out" ./... | tee "$RUNNER_TEMP/go-test.log"
          if grep -E "set GATEFLOW_TEST_(POSTGRES|REDIS)_URL" "$RUNNER_TEMP/go-test.log"; then exit 1; fi
      - name: Report statement coverage
        shell: bash
        run: |
          {
            echo "### Go statement coverage (with Postgres and Redis)"
            echo '```text'
            go tool cover -func="$RUNNER_TEMP/cover.out" | grep -E '^total:'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func="$RUNNER_TEMP/cover.out" | grep -E '^total:'

  compose:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker compose -f deploy/compose/compose.yaml up --build --detach
      - name: Check every health endpoint
        run: |
          for port in 8080 8081 8082 8090 8070; do
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 "http://localhost:$port/healthz"; then echo; continue 2; fi
              sleep 2
            done
            echo "port $port never became healthy"
            docker compose -f deploy/compose/compose.yaml logs
            exit 1
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s test/e2e -v
      - name: Run the end-to-end test
        run: |
          python test/e2e/smoke.py || {
            docker compose -f deploy/compose/compose.yaml logs
            exit 1
          }
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down --volumes
