name: Tests
on:
  push:
    branches: [main]
  # A retargeted stacked PR is rebased and pushed, which reruns this as synchronize.
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/repo/tests -v

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  integration:
    name: Go integration (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway CI superuser; pkg/pgtest creates and drops one database per test.
      GATEFLOW_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run every test against Postgres, failing if any database test skipped
        shell: bash
        run: |
          go test -count=1 -v ./... | tee "$RUNNER_TEMP/go-test.log"
          if grep -F "set GATEFLOW_TEST_POSTGRES_URL" "$RUNNER_TEMP/go-test.log"; then exit 1; fi

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker compose -f deploy/compose/compose.yaml up --build --detach
      - name: Check every health endpoint
        run: |
          for port in 8080 8081 8082 8090; do
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 "http://localhost:$port/healthz"; then echo; continue 2; fi
              sleep 2
            done
            echo "port $port never became healthy"
            docker compose -f deploy/compose/compose.yaml logs
            exit 1
          done
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s test/e2e -v
      - name: Run the end-to-end test
        run: |
          python test/e2e/smoke.py || {
            docker compose -f deploy/compose/compose.yaml logs
            exit 1
          }
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down --volumes
