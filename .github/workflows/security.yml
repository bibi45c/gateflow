name: Security
# Issue #156: scan Go code and dependencies, the service images and the infrastructure
# definitions on every PR and push to main. Accepted findings are listed, with their
# reasons, in .trivyignore.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Report the Go toolchain
        run: go version
      - name: Scan reachable vulnerabilities in the code and its modules
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  images:
    name: Image scan (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            target: services/gateway
          - service: access
            target: services/access
          - service: metering
            target: services/metering
          - service: mock-upstream
            target: test/mock-upstream
          - service: console
            target: services/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: TARGET=${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: gateflow-${{ matrix.service }}:scan
      - name: Install the pinned, checksum-verified Trivy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/repo/install_trivy.py --directory "$RUNNER_TEMP/bin"
      - name: Write SARIF for code scanning
        run: >-
          "$RUNNER_TEMP/bin/trivy" image --quiet --format sarif --output trivy-image.sarif
          --severity HIGH,CRITICAL --ignore-unfixed gateflow-${{ matrix.service }}:scan
      - name: Upload SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}
      - name: Fail on a fixable HIGH or CRITICAL vulnerability
        run: >-
          "$RUNNER_TEMP/bin/trivy" image --quiet --exit-code 1
          --severity HIGH,CRITICAL --ignore-unfixed gateflow-${{ matrix.service }}:scan

  config:
    name: Infrastructure configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the pinned, checksum-verified Trivy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/repo/install_trivy.py --directory "$RUNNER_TEMP/bin"
      - name: Write SARIF for code scanning
        run: >-
          "$RUNNER_TEMP/bin/trivy" config --quiet --format sarif --output trivy-config.sarif
          --severity HIGH,CRITICAL --ignorefile .trivyignore deploy
      - name: Upload SARIF
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Fail on a HIGH or CRITICAL misconfiguration in Terraform, the chart or the Dockerfile
        run: |
          "$RUNNER_TEMP/bin/trivy" config --quiet --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore deploy/terraform
          "$RUNNER_TEMP/bin/trivy" config --quiet --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore deploy/helm/gateflow
          "$RUNNER_TEMP/bin/trivy" config --quiet --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore deploy/docker
