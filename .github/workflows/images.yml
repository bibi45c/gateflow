name: Service images
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read

jobs:
  build:
    name: Image build (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: &images
        include:
          - service: gateway
            target: services/gateway
          - service: access
            target: services/access
          - service: metering
            target: services/metering
          - service: mock-upstream
            target: test/mock-upstream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare tags
        id: metadata
        run: python tools/repo/image_metadata.py --service ${{ matrix.service }}
      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: TARGET=${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/bibi45c/gateflow
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish image (${{ matrix.service }})
    if: github.event_name == 'push' && github.repository == 'bibi45c/gateflow' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: *images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare tags
        id: metadata
        run: python tools/repo/image_metadata.py --service ${{ matrix.service }}
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: TARGET=${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/bibi45c/gateflow
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python tools/repo/image_metadata.py --service ${{ matrix.service }} --digest "$IMAGE_DIGEST"
